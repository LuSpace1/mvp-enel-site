<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Portal Me de Enel">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#006fbb" />
      <stop offset="1" stop-color="#00538f" />
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#eef1f5" />

  <!-- Ventana del navegador -->
  <rect width="1600" height="56" fill="#f1f3f6" />
  <circle cx="28" cy="28" r="6" fill="#ff5f57" />
  <circle cx="50" cy="28" r="6" fill="#febc2e" />
  <circle cx="72" cy="28" r="6" fill="#28c840" />
  <rect x="560" y="14" width="480" height="28" rx="14" fill="#ffffff" />
  <text x="800" y="33" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#6b7280">enel.service-now.com/me</text>

  <!-- Header del portal -->
  <rect y="56" width="1600" height="88" fill="#ffffff" />
  <line x1="0" y1="144" x2="1600" y2="144" stroke="#e5e7eb" stroke-width="1" />
  <text x="56" y="114" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="700" letter-spacing="-1.5" fill="#006fbb">enel</text>
  <text x="250" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#141413">Inicio</text>
  <text x="348" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#6b7280">Noticias</text>
  <text x="456" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#6b7280">Personas</text>
  <text x="572" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#6b7280">Beneficios</text>
  <text x="694" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#6b7280">Formación</text>
  <rect x="56" y="122" width="58" height="3" rx="1.5" fill="#006fbb" />
  <circle cx="1530" cy="100" r="18" fill="#dbeafe" />
  <circle cx="1530" cy="94" r="6" fill="#006fbb" />
  <path d="M1518 112c2-6 6-9 12-9s10 3 12 9z" fill="#006fbb" />

  <!-- Hero -->
  <rect x="56" y="176" width="1488" height="300" rx="24" fill="url(#hero)" />
  <circle cx="1370" cy="236" r="190" fill="#ffffff" opacity="0.06" />
  <circle cx="1450" cy="420" r="130" fill="#ffffff" opacity="0.05" />
  <text x="104" y="252" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#ffffff" opacity="0.75">INTRANET</text>
  <text x="104" y="326" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5" fill="#ffffff">Bienvenido a Me</text>
  <text x="104" y="368" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#ffffff" opacity="0.82">Noticias, personas y recursos para tu día a día.</text>
  <rect x="104" y="396" width="196" height="48" rx="24" fill="#ffffff" />
  <text x="202" y="426" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#006fbb">Ver novedades</text>

  <!-- Novedades -->
  <text x="56" y="542" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#141413">Novedades</text>
  <text x="1544" y="542" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#006fbb">Ver todas</text>

  <!-- Tarjeta 1 -->
  <rect x="56" y="566" width="472" height="278" rx="18" fill="#ffffff" stroke="#e5e7eb" />
  <rect x="72" y="582" width="440" height="132" rx="12" fill="#dbeafe" />
  <circle cx="292" cy="648" r="26" fill="#006fbb" opacity="0.18" />
  <text x="88" y="750" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#006fbb">PERSONAS</text>
  <text x="88" y="784" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#141413">Nueva política de</text>
  <text x="88" y="810" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#141413">teletrabajo</text>

  <!-- Tarjeta 2 -->
  <rect x="564" y="566" width="472" height="278" rx="18" fill="#ffffff" stroke="#e5e7eb" />
  <rect x="580" y="582" width="440" height="132" rx="12" fill="#fce7f3" />
  <circle cx="800" cy="648" r="26" fill="#eb0053" opacity="0.18" />
  <text x="596" y="750" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#eb0053">RECONOCIMIENTOS</text>
  <text x="596" y="784" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#141413">Equipos de operación</text>
  <text x="596" y="810" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#141413">destacados del mes</text>

  <!-- Tarjeta 3 -->
  <rect x="1072" y="566" width="472" height="278" rx="18" fill="#ffffff" stroke="#e5e7eb" />
  <rect x="1088" y="582" width="440" height="132" rx="12" fill="#dcfce7" />
  <circle cx="1308" cy="648" r="26" fill="#008556" opacity="0.18" />
  <text x="1104" y="750" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#008556">FORMACIÓN</text>
  <text x="1104" y="784" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#141413">Calendario de</text>
  <text x="1104" y="810" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#141413">capacitaciones</text>

  <!-- Accesos rápidos -->
  <rect x="56" y="876" width="348" height="56" rx="28" fill="#ffffff" stroke="#e5e7eb" />
  <circle cx="90" cy="904" r="7" fill="#006fbb" />
  <text x="112" y="910" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#141413">Mi perfil</text>

  <rect x="436" y="876" width="348" height="56" rx="28" fill="#ffffff" stroke="#e5e7eb" />
  <circle cx="470" cy="904" r="7" fill="#eb0053" />
  <text x="492" y="910" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#141413">Beneficios</text>

  <rect x="816" y="876" width="348" height="56" rx="28" fill="#ffffff" stroke="#e5e7eb" />
  <circle cx="850" cy="904" r="7" fill="#008556" />
  <text x="872" y="910" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#141413">Formación</text>

  <rect x="1196" y="876" width="348" height="56" rx="28" fill="#ffffff" stroke="#e5e7eb" />
  <circle cx="1230" cy="904" r="7" fill="#f59e0b" />
  <text x="1252" y="910" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#141413">Directorio</text>
</svg>
