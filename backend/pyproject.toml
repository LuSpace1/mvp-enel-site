[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.3",
    "ruff>=0.9",
    "django-oauth-toolkit>=3.4.1",
    "python-dotenv>=1.0",
    "pillow>=11.0",
    "psycopg[binary]>=3.2.0",
]

[tool.ruff]
exclude = ["**/migrations/*"]

[tool.ruff.lint]
ignore = ["RUF012"]
